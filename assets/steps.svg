    </text>
    <text x="320.0" y="124" text-anchor="middle" font-size="24" font-weight="700" fill="#8b949e">Teach it to use tools
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.250;0.270;0.347;0.375;1"/>
