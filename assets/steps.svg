    </rect>
    <text x="320.0" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#8b949e">Spot the boring problem
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#e6edf3;#e6edf3;#8b949e;#8b949e;#e6edf3" keyTimes="0;0.097;0.125;0.972;1"/>
      <animate attributeName="font-weight" calcMode="discrete" dur="16s" repeatCount="indefinite" values="700;700;400;400;700" keyTimes="0;0.097;0.125;0.972;1"/>
    </text>
    <text x="320.0" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#8b949e">Give the model the right context
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.125;0.145;0.222;0.250;1"/>
