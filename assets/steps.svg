      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.750;0.770;0.847;0.875;1"/>
      <animate attributeName="font-weight" calcMode="discrete" dur="16s" repeatCount="indefinite" values="400;400;700;700;400;400" keyTimes="0;0.750;0.770;0.847;0.875;1"/>
    </text>
    <text x="320.0" y="304" text-anchor="middle" font-size="24" font-weight="700" fill="#8b949e">Make it better
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e" keyTimes="0;0.875;0.895;0.972;1"/>
      <animate attributeName="font-weight" calcMode="discrete" dur="16s" repeatCount="indefinite" values="400;400;700;700;400" keyTimes="0;0.875;0.895;0.972;1"/>
