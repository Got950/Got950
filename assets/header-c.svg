<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="titleC descC">
  <title id="titleC">Harshit, AI Engineer</title>
  <desc id="descC">The name on the left. A short note on the right, set on a narrow measure.</desc>
  <defs>
    <clipPath id="cardC">
      <rect width="1200" height="300" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cardC)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect width="1200" height="300" fill="#0d1117"/>
    <text x="72" y="178" fill="#e6edf3" font-size="104" font-weight="700">Harshit</text>
    <text x="700" y="118" fill="#58a6ff" font-size="32">AI engineer</text>
    <text x="700" y="162" fill="#e6edf3" font-size="28">in Hyderabad.</text>
    <text x="700" y="214" fill="#8b949e" font-size="28">Language models,</text>
    <text x="700" y="252" fill="#8b949e" font-size="28">vision, and edge AI.</text>
  </g>
</svg>
