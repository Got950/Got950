<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="titleA descA">
  <title id="titleA">Harshit, AI Engineer</title>
  <desc id="descA">A short letter. The name, then two sentences.</desc>
  <defs>
    <clipPath id="cardA">
      <rect width="1200" height="300" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cardA)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect width="1200" height="300" fill="#0d1117"/>
    <text x="72" y="124" fill="#e6edf3" font-size="92" font-weight="700">Harshit</text>
    <text x="72" y="186" fill="#58a6ff" font-size="32">AI engineer in Hyderabad.</text>
    <text x="72" y="232" fill="#8b949e" font-size="28">I work on language models, vision,</text>
    <text x="72" y="268" fill="#8b949e" font-size="28">and models that run on the device.</text>
  </g>
</svg>
