<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="titleB descB">
  <title id="titleB">Harshit, AI engineer in Hyderabad, India</title>
  <desc id="descB">A dark poster. The name sits in a blue block. Hyderabad and India sit on their own lines.</desc>
  <defs>
    <clipPath id="cardB">
      <rect width="1200" height="300" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cardB)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect width="1200" height="300" fill="#161b22"/>
    <rect x="20" y="24" width="496" height="252" rx="12" fill="#1f6feb"/>
    <text x="60" y="184" fill="#0d1117" font-size="108" font-weight="700">Harshit</text>
    <text x="564" y="132" fill="#e6edf3" font-size="52" font-weight="700">AI engineer</text>
    <text x="564" y="186" fill="#58a6ff" font-size="36">Hyderabad</text>
    <text x="564" y="230" fill="#58a6ff" font-size="36">India</text>
  </g>
</svg>
