<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-labelledby="titleLoop descLoop">
  <title id="titleLoop">How I build</title>
  <desc id="descLoop">Spot the boring problem. Give AI the right context. Teach it to use tools. Try to break it. Measure what actually improved. Ship it. Watch it. Make it better.</desc>
  <defs>
    <clipPath id="loopCard"><rect width="680" height="440" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#loopCard)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect width="680" height="440" fill="#161b22"/>
    <rect x="48" width="8" height="28" rx="4" fill="#58a6ff">
      <animate attributeName="y" calcMode="discrete" dur="16s" repeatCount="indefinite" values="32;80;128;176;224;272;320;368" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </rect>
    <text x="80" y="58" font-size="32" fill="#8b949e">Spot the boring problem
      <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite" values="#e6edf3;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </text>
    <text x="80" y="106" font-size="32" fill="#8b949e">Give AI the right context
      <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite" values="#8b949e;#e6edf3;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </text>
    <text x="80" y="154" font-size="32" fill="#8b949e">Teach it to use tools
      <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </text>
    <text x="80" y="202" font-size="32" fill="#8b949e">Try to break it
      <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#8b949e;#e6edf3;#8b949e;#8b949e;#8b949e;#8b949e" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </text>
    <text x="80" y="250" font-size="32" fill="#8b949e">Measure what actually improved
      <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#8b949e;#8b949e;#e6edf3;#8b949e;#8b949e;#8b949e" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </text>
    <text x="80" y="298" font-size="32" fill="#8b949e">Ship it
      <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#e6edf3;#8b949e;#8b949e" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </text>
    <text x="80" y="346" font-size="32" fill="#8b949e">Watch it
      <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#e6edf3;#8b949e" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </text>
    <text x="80" y="394" font-size="32" fill="#8b949e">Make it better
      <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#8b949e;#e6edf3" keyTimes="0.000;0.125;0.250;0.375;0.500;0.625;0.750;0.875"/>
    </text>
  </g>
</svg>
