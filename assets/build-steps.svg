<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="titleLoop descLoop">
  <title id="titleLoop">How I build</title>
  <desc id="descLoop">Spot the boring problem. Give the model the right context. Teach it to use tools. Try to break it. Measure what actually improved. Ship it. Watch it. Make it better.</desc>
  <defs>
    <clipPath id="loopCard"><rect width="560" height="360" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#loopCard)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect width="560" height="360" fill="#161b22"/>
    <rect x="28" width="6" height="18" rx="3" fill="#58a6ff">
      <animate attributeName="y" calcMode="linear" dur="16s" repeatCount="indefinite" values="34;34;74;74;114;114;154;154;194;194;234;234;274;274;314;314;34" keyTimes="0.000;0.097;0.125;0.222;0.250;0.347;0.375;0.472;0.500;0.597;0.625;0.722;0.750;0.847;0.875;0.972;1"/>
    </rect>
    <text x="48" y="52" font-size="26" fill="#8b949e">Spot the boring problem
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#e6edf3;#e6edf3;#8b949e;#8b949e;#e6edf3" keyTimes="0;0.097;0.125;0.972;1"/>
    </text>
    <text x="48" y="92" font-size="26" fill="#8b949e">Give the model the right context
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.125;0.145;0.222;0.250;1"/>
    </text>
    <text x="48" y="132" font-size="26" fill="#8b949e">Teach it to use tools
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.250;0.270;0.347;0.375;1"/>
    </text>
    <text x="48" y="172" font-size="26" fill="#8b949e">Try to break it
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.375;0.395;0.472;0.500;1"/>
    </text>
    <text x="48" y="212" font-size="26" fill="#8b949e">Measure what actually improved
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.500;0.520;0.597;0.625;1"/>
    </text>
    <text x="48" y="252" font-size="26" fill="#8b949e">Ship it
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.625;0.645;0.722;0.750;1"/>
    </text>
    <text x="48" y="292" font-size="26" fill="#8b949e">Watch it
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e;#8b949e" keyTimes="0;0.750;0.770;0.847;0.875;1"/>
    </text>
    <text x="48" y="332" font-size="26" fill="#8b949e">Make it better
      <animate attributeName="fill" calcMode="linear" dur="16s" repeatCount="indefinite" values="#8b949e;#8b949e;#e6edf3;#e6edf3;#8b949e" keyTimes="0;0.875;0.895;0.972;1"/>
    </text>
  </g>
</svg>
